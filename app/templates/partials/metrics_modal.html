<!-- Metrics Modal Content -->
<div class="p-5">
    <div class="flex justify-between items-center mb-5">
        <h3 class="text-lg font-bold flex items-center gap-3">
            <span class="text-purple-400">📊</span>
            <span class="text-purple-200">Метрики:</span>
            <span class="text-purple-400 font-mono">{{ container_id }}</span>
            <span class="text-xs text-gray-500 px-2 py-1 bg-purple-900/30 rounded-lg">@ {{ host_name }}</span>
        </h3>
        <div class="flex gap-2">
            <button onclick="loadMetrics('1h')"
                class="period-btn text-xs px-3 py-1.5 rounded-lg bg-purple-900/50 hover:bg-purple-800/70 transition border border-purple-700/50 text-purple-200"
                data-period="1h">1ч</button>
            <button onclick="loadMetrics('6h')"
                class="period-btn text-xs px-3 py-1.5 rounded-lg bg-purple-900/50 hover:bg-purple-800/70 transition border border-purple-700/50 text-purple-200"
                data-period="6h">6ч</button>
            <button onclick="loadMetrics('24h')" class="period-btn text-xs px-3 py-1.5 rounded-lg bg-gradient-to-r from-purple-600 to-violet-600 transition text-white"
                data-period="24h">24ч</button>
            <button onclick="loadMetrics('7d')"
                class="period-btn text-xs px-3 py-1.5 rounded-lg bg-purple-900/50 hover:bg-purple-800/70 transition border border-purple-700/50 text-purple-200"
                data-period="7d">7д</button>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <!-- CPU Chart -->
        <div class="bg-[#12121a] rounded-xl p-5 border border-purple-900/30">
            <h4 class="text-sm font-semibold text-violet-400 mb-3 flex items-center gap-2">
                <span>🔥</span> CPU Usage
            </h4>
            <div class="relative h-48">
                <canvas id="cpuChart"></canvas>
            </div>
        </div>

        <!-- Memory Chart -->
        <div class="bg-[#12121a] rounded-xl p-5 border border-purple-900/30">
            <h4 class="text-sm font-semibold text-purple-400 mb-3 flex items-center gap-2">
                <span>💾</span> Memory Usage
            </h4>
            <div class="relative h-48">
                <canvas id="memChart"></canvas>
            </div>
        </div>
    </div>

    <div id="metrics-status" class="text-center text-xs text-purple-400/50 mt-5 py-2">
        <span class="animate-pulse">Загрузка данных...</span>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    (function () {
        const containerId = '{{ container_id }}';
        const hostName = '{{ host_name }}';
        let cpuChart, memChart;

        function createChart(ctx, label, color, gradientColor) {
            const gradient = ctx.getContext('2d').createLinearGradient(0, 0, 0, 200);
            gradient.addColorStop(0, gradientColor + '40');
            gradient.addColorStop(1, gradientColor + '00');

            return new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: label,
                        data: [],
                        borderColor: color,
                        backgroundColor: gradient,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            grid: { color: '#1a1a2e' },
                            ticks: { color: '#6b7280', maxTicksLimit: 8 }
                        },
                        y: {
                            min: 0,
                            max: 100,
                            grid: { color: '#1a1a2e' },
                            ticks: {
                                color: '#6b7280',
                                callback: function (value) { return value + '%'; }
                            }
                        }
                    }
                }
            });
        }

        window.loadMetrics = async function (period = '24h') {
            document.querySelectorAll('.period-btn').forEach(btn => {
                btn.classList.remove('bg-gradient-to-r', 'from-purple-600', 'to-violet-600', 'text-white');
                btn.classList.add('bg-purple-900/50', 'text-purple-200');
            });
            const activeBtn = document.querySelector(`[data-period="${period}"]`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-purple-900/50', 'text-purple-200');
                activeBtn.classList.add('bg-gradient-to-r', 'from-purple-600', 'to-violet-600', 'text-white');
            }

            try {
                const response = await fetch(`/metrics/${hostName}/${containerId}/data?period=${period}`);
                const data = await response.json();

                if (data.count === 0) {
                    document.getElementById('metrics-status').innerHTML = '<span class="text-gray-500">Нет данных за выбранный период. Данные собираются каждые 5 секунд.</span>';
                    return;
                }

                cpuChart.data.labels = data.labels;
                cpuChart.data.datasets[0].data = data.cpu;
                cpuChart.update();

                memChart.data.labels = data.labels;
                memChart.data.datasets[0].data = data.memory;
                memChart.update();

                document.getElementById('metrics-status').innerHTML = `<span class="text-purple-400/70">Показано ${data.count} точек данных</span>`;
            } catch (e) {
                console.error('Metrics error:', e);
                document.getElementById('metrics-status').innerHTML = '<span class="text-red-400">Ошибка загрузки данных</span>';
            }
        };

        // Initialize charts immediately (HTMX loads this after DOM is ready)
        setTimeout(() => {
            cpuChart = createChart(document.getElementById('cpuChart'), 'CPU %', '#8b5cf6', '#8b5cf6');
            memChart = createChart(document.getElementById('memChart'), 'Memory %', '#a855f7', '#a855f7');
            loadMetrics('24h');
        }, 100);
    })();
</script>
