<!-- Terminal Modal -->
<dialog id="terminal-modal" class="bg-transparent p-0 w-[95%] max-w-5xl h-[80vh]">
    <div class="bg-[#0a0a0f] border border-purple-800/50 rounded-2xl shadow-2xl flex flex-col h-full glow-purple">
        <div class="p-4 border-b border-purple-900/50 flex justify-between items-center bg-gradient-to-r from-[#12121a] to-[#16162a] rounded-t-2xl">
            <h3 class="font-bold flex items-center gap-3 text-sm">
                <span class="text-lg">🖥️</span>
                <span class="text-purple-200">Terminal:</span>
                <span id="terminal-container-name" class="text-purple-400 font-mono"></span>
            </h3>
            <div class="flex items-center gap-3">
                <span id="terminal-status" class="text-xs text-gray-500 px-3 py-1 bg-purple-900/30 rounded-lg border border-purple-800/30">Connecting...</span>
                <button onclick="closeTerminal()"
                    class="text-gray-400 hover:text-white transition p-2 hover:bg-purple-900/30 rounded-xl">
                    ✕
                </button>
            </div>
        </div>
        <div id="terminal-container" class="flex-1 p-2 bg-[#08080c] rounded-b-2xl"></div>
    </div>
</dialog>

<!-- xterm.js CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.min.js"></script>

<script>
    let terminal = null;
    let terminalSocket = null;
    let fitAddon = null;

    function openTerminal(hostName, containerId, containerName) {
        const modal = document.getElementById('terminal-modal');
        const containerEl = document.getElementById('terminal-container');
        const nameEl = document.getElementById('terminal-container-name');
        const statusEl = document.getElementById('terminal-status');

        nameEl.textContent = containerName;
        containerEl.innerHTML = '';

        // Initialize xterm with purple theme
        terminal = new Terminal({
            cursorBlink: true,
            fontSize: 14,
            fontFamily: 'JetBrains Mono, Menlo, Monaco, Consolas, monospace',
            theme: {
                background: '#08080c',
                foreground: '#e4e4e7',
                cursor: '#a855f7',
                cursorAccent: '#08080c',
                selection: '#7c3aed40',
                black: '#0a0a0f',
                red: '#f87171',
                green: '#4ade80',
                yellow: '#facc15',
                blue: '#60a5fa',
                magenta: '#c084fc',
                cyan: '#22d3ee',
                white: '#e4e4e7',
                brightBlack: '#52525b',
                brightRed: '#fca5a5',
                brightGreen: '#86efac',
                brightYellow: '#fde047',
                brightBlue: '#93c5fd',
                brightMagenta: '#d8b4fe',
                brightCyan: '#67e8f9',
                brightWhite: '#fafafa'
            }
        });

        fitAddon = new FitAddon.FitAddon();
        terminal.loadAddon(fitAddon);
        terminal.loadAddon(new WebLinksAddon.WebLinksAddon());

        terminal.open(containerEl);
        fitAddon.fit();

        // Connect WebSocket
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProtocol}//${window.location.host}/ws/terminal/${hostName}/${containerId}`;

        statusEl.textContent = 'Connecting...';
        statusEl.className = 'text-xs text-yellow-400 px-3 py-1 bg-yellow-900/30 rounded-lg border border-yellow-800/30';

        terminalSocket = new WebSocket(wsUrl);

        terminalSocket.onopen = function () {
            statusEl.textContent = 'Connected';
            statusEl.className = 'text-xs text-green-400 px-3 py-1 bg-green-900/30 rounded-lg border border-green-800/30';
            terminal.focus();
        };

        terminalSocket.onmessage = function (event) {
            terminal.write(event.data);
        };

        terminalSocket.onclose = function () {
            statusEl.textContent = 'Disconnected';
            statusEl.className = 'text-xs text-red-400 px-3 py-1 bg-red-900/30 rounded-lg border border-red-800/30';
            terminal.write('\r\n\x1b[31m[Connection closed]\x1b[0m\r\n');
        };

        terminalSocket.onerror = function () {
            statusEl.textContent = 'Error';
            statusEl.className = 'text-xs text-red-400 px-3 py-1 bg-red-900/30 rounded-lg border border-red-800/30';
        };

        // Send keystrokes to server
        terminal.onData(function (data) {
            if (terminalSocket && terminalSocket.readyState === WebSocket.OPEN) {
                terminalSocket.send(data);
            }
        });

        modal.showModal();

        // Resize handling
        window.addEventListener('resize', handleTerminalResize);
        setTimeout(() => fitAddon.fit(), 100);
    }

    function handleTerminalResize() {
        if (fitAddon) {
            fitAddon.fit();
        }
    }

    function closeTerminal() {
        const modal = document.getElementById('terminal-modal');

        if (terminalSocket) {
            terminalSocket.close();
            terminalSocket = null;
        }

        if (terminal) {
            terminal.dispose();
            terminal = null;
        }

        window.removeEventListener('resize', handleTerminalResize);
        modal.close();
    }

    // Close on escape
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && document.getElementById('terminal-modal').open) {
            closeTerminal();
        }
    });
</script>
