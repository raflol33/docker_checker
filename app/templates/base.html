<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Менеджер</title>
    <!-- Local static files for offline support -->
    <script src="/static/htmx.min.js"></script>
    <script src="/static/tailwindcss.js"></script>
    <style>
        .htmx-indicator {
            opacity: 0;
            transition: opacity 500ms ease-in;
        }

        .htmx-request .htmx-indicator {
            opacity: 1
        }

        .htmx-request.htmx-indicator {
            opacity: 1
        }
    </style>
</head>

<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">
    <nav class="bg-gray-800 border-b border-gray-700 p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-400">🐳 Docker Менеджер</h1>
            {% if user %}
            <div class="flex items-center gap-4">
                <a href="/alerts" class="text-gray-400 hover:text-white text-sm transition">🔔 Alerts</a>
                <a href="/ssh-keys" class="text-gray-400 hover:text-white text-sm transition">🔑 SSH Keys</a>
                <span class="text-gray-300">{{ user.username }}</span>
                <a href="/logout" class="text-red-400 hover:text-red-300 text-sm">Выйти</a>
            </div>
            {% endif %}


        </div>
    </nav>

    <main class="container mx-auto p-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-gray-500 text-xs py-4 mt-8">
        Docker Менеджер - Демо Версия
    </footer>
</body>

</html>
